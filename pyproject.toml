[project]
name = "llm-systems-from-scratch"
version = "0.0.1"
description = "A small Llama-style LLM training + inference stack, optimized one measured bottleneck at a time."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ravi Majeti" }]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "tiktoken",
]

[project.optional-dependencies]
# Pick exactly one torch build:
#   Mac / CI:   uv sync --extra cpu    (macOS wheels include MPS)
#   NVIDIA box: uv sync --extra cu128
cpu = ["torch"]
cu128 = ["torch"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmsys"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
